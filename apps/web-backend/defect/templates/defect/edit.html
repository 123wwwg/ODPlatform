{% extends "defect/base.html" %}
{% block title %}编辑缺陷记录{% endblock %}
{% block content %}
<h1>编辑缺陷记录 #{{ record.id }}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button class="button primary" type="submit">保存修改</button>
        <a class="button" href="{% url 'defect_detail' record.id %}">取消</a>
    </div>
</form>
{% endblock %}
