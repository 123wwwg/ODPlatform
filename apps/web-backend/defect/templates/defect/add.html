{% extends "defect/base.html" %}
{% block title %}新增缺陷记录{% endblock %}
{% block content %}
<h1>新增缺陷检测记录</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button class="button primary" type="submit">提交保存</button>
        <a class="button" href="{% url 'defect_list' %}">返回列表</a>
    </div>
</form>
{% endblock %}
