{% extends "defect/base.html" %}
{% block title %}确认删除{% endblock %}
{% block content %}
<h1>确认删除这条缺陷记录？</h1>
<p>{{ record.defect_type.type_name }} | {{ record.detect_person }} | {{ record.device_id }}</p>
<form method="post">
    {% csrf_token %}
    <div class="form-actions">
        <button class="button danger" type="submit">确认删除</button>
        <a class="button" href="{% url 'defect_list' %}">取消</a>
    </div>
</form>
{% endblock %}
