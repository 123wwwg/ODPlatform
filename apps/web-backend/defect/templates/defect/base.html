<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ODPlatform 缺陷台账{% endblock %}</title>
    <style>
        :root { color-scheme: light; --ink:#162033; --muted:#667085; --brand:#0f766e; --line:#dce3ea; --soft:#f3f7fa; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:"Microsoft YaHei","Segoe UI",sans-serif; color:var(--ink); background:#eaf0f4; }
        .shell { max-width:1180px; margin:28px auto; padding:0 20px; }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 22px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 10px 30px rgba(31,45,61,.08); }
        .brand { display:flex; align-items:center; gap:12px; font-size:20px; font-weight:700; }
        .mark { width:38px; height:38px; display:grid; place-items:center; border-radius:11px; color:#fff; background:linear-gradient(135deg,#0f766e,#0ea5a4); }
        .nav { display:flex; gap:10px; flex-wrap:wrap; }
        .nav a, .button { text-decoration:none; color:inherit; border:1px solid var(--line); background:#fff; border-radius:9px; padding:9px 13px; }
        .nav a.primary, .button.primary { color:#fff; background:var(--brand); border-color:var(--brand); }
        .card { margin-top:20px; padding:22px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 10px 30px rgba(31,45,61,.06); }
        h1, h2 { margin-top:0; }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:11px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; }
        th { color:var(--muted); background:var(--soft); }
        .actions { display:flex; gap:7px; flex-wrap:wrap; }
        .actions a, button { border:0; border-radius:7px; padding:6px 10px; cursor:pointer; text-decoration:none; color:#156a64; background:#e7f6f4; }
        .danger { color:#a33131 !important; background:#fcecec !important; }
        form p { margin:0 0 16px; }
        label { display:block; margin-bottom:6px; font-weight:600; }
        input, select, textarea { width:100%; max-width:640px; padding:10px 11px; border:1px solid #cbd5e1; border-radius:8px; font:inherit; }
        .form-actions { display:flex; gap:10px; margin-top:18px; }
        .empty { padding:32px; text-align:center; color:var(--muted); }
        .errors { color:#a33131; margin:8px 0; }
        .images { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; margin-top:18px; }
        .images img { width:100%; border-radius:12px; border:1px solid var(--line); }
        @media (max-width:720px) {
            .topbar { align-items:flex-start; flex-direction:column; }
            .card { overflow-x:auto; }
            th, td { white-space:nowrap; }
        }
    </style>
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div class="brand"><span class="mark">OD</span><span>ODPlatform · 缺陷检测台账</span></div>
        <nav class="nav">
            <a class="primary" href="{% url 'frontend_home' %}">Vue 工作台</a>
            <a href="{% url 'defect_list' %}">记录列表</a>
            <a href="{% url 'defect_add' %}">新增记录</a>
            <a href="/admin/">后台管理</a>
        </nav>
    </header>
    <section class="card">
        {% block content %}{% endblock %}
    </section>
</main>
</body>
</html>
