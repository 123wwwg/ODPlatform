#==============================================================================
# YOLO 验证配置
# 自动生成时间: 2026-10-25 12:14:41
#==============================================================================


#------------------------------------------------------------------------------
# 核心参数
#------------------------------------------------------------------------------

# 模型文件路径(.pt 或 .yaml)
# 示例: yolo11n.pt, yolo11s.pt, path/to/custom.pt
# 提示:
#   - 支持 .pt 权重文件或 .yaml 配置文件
#   - 官方模型: yolo11n/s/m/l/x.pt (n 最快, x 最准)
#   - 训练时如未指定, 默认从头训练
model: null

# 数据集配置文件(D3 odp-transform 产出的那份 yaml)
# 示例: data.yaml, rsod.yaml, configs/datasets/safety.yaml
# 提示:
#   - YAML 文件定义数据集路径和类别信息
#   - 必须包含: path, train, val, names
#   - 如果只给数据集名(如 'rsod'), 框架会通过 paths.dataset_yaml_path() 解析
data: null

# 任务类型(只能是 detect / segment)
# 示例: detect, segment
# 提示:
#   - 限定取值: detect / segment
#   - 决定模型加载方式
#   - 注意: task 不传给 ultralytics (model.val() 从权重推断)
task: detect

# 实验名(None=自动生成)
# 示例: baseline, helmet_v1, None
# 提示:
#   - None: 由 ultralytics 自动生成 exp / exp2...
#   - 验证输出子目录 runs/val/<name>/
experiment_name: null


#------------------------------------------------------------------------------
# 验证控制
#------------------------------------------------------------------------------

# 验证批次大小
# 示例: 8, 16, 32
# 提示:
#   - 验证时批次大小
#   - 显存不足时减小
batch: 16

# 验证图像尺寸(默认同 imgsz)
# 示例: 480, 640, 800
# 提示:
#   - 验证时单独指定尺寸(默认与 imgsz 一致)
#   - 通常比训练尺寸大, 提升 mAP
val_imgsz: 640

# 置信度阈值(验证=0.001, 全量召回)
# 示例: 0.001, 0.01, 0.05
# 提示:
#   - ★ 验证模式: 低阈值(0.001) 保留所有候选框, 计算完整 mAP
#   - 推理模式默认 0.25 — 语义不同, 勿混用
conf: 0.001

# IoU 阈值(NMS)
# 示例: 0.5, 0.6, 0.7
# 提示:
#   - 评估时 NMS 的 IoU 阈值
#   - mAP50-95 中 50-95 是另一维度, 别混
iou: 0.6

# 是否 FP16 半精度验证
# 示例: False, True
# 提示:
#   - True: 用 FP16 验证(更快省显存)
#   - 与训练 amp 独立控制
half: false

# 是否用 ONNX 引擎验证
# 示例: False, True
# 提示:
#   - True: 使用 ONNX Runtime 验证导出模型
dnn: false

# 验证划分(train / val / test)
# 示例: train, val, test
# 提示:
#   - ★ 从 yaml 里选哪个 split 来验证
#   - 只有 val/test 是诚实的; train 只适合调试
#   - 最终交报告必须用 test
split: val


#------------------------------------------------------------------------------
# 输入配置
#------------------------------------------------------------------------------

# 输入图像尺寸(像素)
# 示例: 320, 480, 640, 800, 1280
# 提示:
#   - 推荐使用 32 的倍数(640, 672, 704...)
#   - 更大尺寸 = 更高精度 + 更多显存 + 更慢速度
#   - 工业检测推荐: 640-800
#   - 小目标检测推荐: 1280+
imgsz: 640

# 数据加载线程数
# 示例: 0, 4, 8, 16
# 提示:
#   - 多线程加速数据加载
#   - 推荐: CPU 核心数的 1-2 倍
#   - Windows 可能需要设为 0
#   - 过高会导致内存占用过多
workers: 8

# 数据缓存(False/True/ram/disk)
# 示例: False, True, ram, disk
# 提示:
#   - False: 不缓存(默认)
#   - True/'ram': 缓存到内存(快但占内存)
#   - 'disk': 缓存到磁盘(节省内存但慢)
#   - 小数据集推荐 ram, 大数据集推荐 disk
cache: false

# 是否启用矩形训练
# 示例: False, True
# 提示:
#   - True: 减少填充, 提升训练速度
#   - 推理时自动启用
#   - 可能轻微影响精度
rect: false


#------------------------------------------------------------------------------
# 设备配置
#------------------------------------------------------------------------------

# 设备选择(0/cpu/mps/[0,1]/0,1)
# 示例: 0, 0, cpu, mps, [0, 1]
# 提示:
#   - None: 自动选择(优先 GPU)
#   - int: GPU 编号(0, 1, 2...)
#   - 'cpu': 使用 CPU
#   - 'mps': Mac M1/M2 GPU
#   - [0,1] 或 '0,1': 多 GPU 训练
#   - -1: 选择最空闲的 GPU
device: null

# 是否启用 AMP(推荐开启)
# 示例: True, False
# 提示:
#   - True: 使用 FP16 混合精度(快 + 省显存)
#   - False: 使用 FP32 全精度
#   - 现代 GPU (20 系+) 强烈推荐开启
#   - CPU 训练时自动禁用
amp: true


#------------------------------------------------------------------------------
# 输出配置
#------------------------------------------------------------------------------

# 项目输出目录(None=框架自动)
# 示例: runs/detect, experiments/safety
# 提示:
#   - 训练输出的根目录
#   - 默认: 由 service 层根据 task 自动拼装(runs/<task>/)
project: null

# 实验名称
# 示例: exp, safety_v1, baseline
# 提示:
#   - 每次运行的子目录名
#   - 默认: ultralytics 自动生成 exp, exp2, exp3...
name: null

# 是否覆盖已有实验目录
# 示例: False, True
# 提示:
#   - False: 自动创建新目录(exp2, exp3...)
#   - True: 覆盖已有目录
#   - 生产环境建议 False
exist_ok: false

# 是否保存检查点
# 示例: True, False
# 提示:
#   - True: 保存 last.pt 和 best.pt
#   - False: 不保存检查点(节省磁盘)
save: true


#------------------------------------------------------------------------------
# 基础设置
#------------------------------------------------------------------------------

# 是否显示详细日志
# 示例: True, False
# 提示:
#   - True: 显示详细日志
#   - False: 只显示关键信息
verbose: true

# 随机种子(可复现性)
# 示例: 0, 42, 2026
# 提示:
#   - 控制随机性, 确保可复现
#   - 相同种子 = 相同结果
#   - 建议每个实验使用不同种子
seed: 0

# 是否强制确定性算法
# 示例: True, False
# 提示:
#   - True: 强制使用确定性算法(完全可复现)
#   - False: 允许非确定性算法(可能更快)
#   - 实验对比时必须设为 True
deterministic: true


#------------------------------------------------------------------------------
# 输出控制
#------------------------------------------------------------------------------

# 是否保存 JSON 结果
# 示例: True, False
# 提示:
#   - 保存预测结果到 JSON 文件
#   - 后续分析/对比用
save_json: true

# 是否保存混合标签
# 示例: False, True
# 提示:
#   - 标签 + 预测同时保存到输出图
#   - 检查错检漏检用
save_hybrid: false

# 是否保存 TXT 预测结果
# 示例: False, True
# 提示:
#   - 将预测结果保存为 YOLO 格式 txt
save_txt: false

# 标签是否显示置信度
# 示例: True, False
# 提示:
#   - 输出图上显示置信度数值
#   - 需配合 save_txt/save_json 等才可见
save_conf: true

# 是否保存预测裁剪图
# 示例: False, True
# 提示:
#   - 保存每个预测框的裁剪图
#   - 方便人工复核
save_crop: false

# 单图最大检测数
# 示例: 100, 300, 1000
# 提示:
#   - 单图最多保留的检测框数
#   - 防止密集场景失控
max_det: 300


#==============================================================================
# 常见问题
#==============================================================================
#
# Q: 如何修改配置?
# A: 直接编辑对应参数的值, 保存后重新运行即可
#
# Q: 命令行参数会覆盖配置文件吗?
# A: 是的, 命令行参数优先级最高: CLI > YAML > DEFAULT
#
# Q: 如何恢复默认配置?
# A: 删除此文件, 程序会自动报错并提示重新生成
#
# Q: 如何用新版默认值重新生成此模板?
# A: 跑 'odp-gen-config <name> --overwrite' (会自动备份原文件)
#    备胎(装包前可用): python -m od_platform.runtime_config.generator <name> --overwrite
#
#==============================================================================