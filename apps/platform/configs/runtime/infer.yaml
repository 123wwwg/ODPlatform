#==============================================================================
# YOLO 推理配置
# 自动生成时间: 2026-10-25 12:14:41
#==============================================================================


#------------------------------------------------------------------------------
# 核心参数
#------------------------------------------------------------------------------

# 模型文件路径(.pt 或 .yaml)
# 示例: yolo11n.pt, yolo11s.pt, path/to/custom.pt
# 提示:
#   - 支持 .pt 权重文件或 .yaml 配置文件
#   - 官方模型: yolo11n/s/m/l/x.pt (n 最快, x 最准)
#   - 训练时如未指定, 默认从头训练
model: null

# 数据集配置文件(D3 odp-transform 产出的那份 yaml)
# 示例: data.yaml, rsod.yaml, configs/datasets/safety.yaml
# 提示:
#   - YAML 文件定义数据集路径和类别信息
#   - 必须包含: path, train, val, names
#   - 如果只给数据集名(如 'rsod'), 框架会通过 paths.dataset_yaml_path() 解析
data: null

# 任务类型(只能是 detect / segment)
# 示例: detect, segment
# 提示:
#   - 限定取值: detect / segment
#   - 决定模型加载方式
#   - 注意: task 不传给 ultralytics (model.predict() 从权重推断)
task: detect

# 实验名(None=自动生成)
# 示例: baseline, helmet_v1, None
# 提示:
#   - 推理输出子目录 runs/predict/<name>/
experiment_name: null

# 推理输入源(图/视频/目录/URL/摄像头/流)
# 示例: image.jpg, video.mp4, path/to/images/, rtsp://example.com/live.sdp, 0
# 提示:
#   - 支持: 图像 / 视频 / 目录 / URL / 摄像头索引 / RTSP 流
#   - 目录: 自动遍历所有图像文件
#   - 0 / '0' / 1: 摄像头编号
#   - None: 必须通过 CLI 传 --source (运行时)
source: null


#------------------------------------------------------------------------------
# 输入配置
#------------------------------------------------------------------------------

# 批次大小(int=固定值, -1=自动, 0-1=显存利用率)
# 示例: 8, 16, 32, -1, 0.7
# 提示:
#   - int: 固定批次大小(如 16)
#   - -1: 自动批次(使用约 60% 显存)
#   - 0.0-1.0: 显存利用率(如 0.7 = 70% 显存)
#   - 显存不足时建议: 8GB → 8-16, 16GB → 32-64
batch: 16

# 数据加载线程数
# 示例: 0, 4, 8, 16
# 提示:
#   - 多线程加速数据加载
#   - 推荐: CPU 核心数的 1-2 倍
#   - Windows 可能需要设为 0
#   - 过高会导致内存占用过多
workers: 8

# 数据缓存(False/True/ram/disk)
# 示例: False, True, ram, disk
# 提示:
#   - False: 不缓存(默认)
#   - True/'ram': 缓存到内存(快但占内存)
#   - 'disk': 缓存到磁盘(节省内存但慢)
#   - 小数据集推荐 ram, 大数据集推荐 disk
cache: false

# 是否启用矩形训练
# 示例: False, True
# 提示:
#   - True: 减少填充, 提升训练速度
#   - 推理时自动启用
#   - 可能轻微影响精度
rect: false


#------------------------------------------------------------------------------
# 推理控制
#------------------------------------------------------------------------------

# 推理图像尺寸(像素)
# 示例: 320, 640, 1280
# 提示:
#   - 推理分辨率
#   - 越大越准越慢
imgsz: 640

# 置信度阈值(默认 0.25)
# 示例: 0.2, 0.25, 0.5, 0.7
# 提示:
#   - ★ 默认 0.25: 推理要'只出靠谱的', 与验证 0.001 语义相反
#   - 工业质检建议: 0.5+
conf: 0.25

# NMS IoU 阈值
# 示例: 0.5, 0.6, 0.7
# 提示:
#   - NMS 去重阈值
#   - 密集场景调低
iou: 0.7

# 单图最大检测数
# 示例: 100, 300, 1000
# 提示:
#   - 单图最多保留的检测框数
max_det: 300

# 视频抽帧步长
# 示例: 1, 2, 5
# 提示:
#   - 视频推理每隔 N 帧处理一帧
#   - 提高速度
vid_stride: 1

# 标注线宽(None=自动)
# 示例: 1, 2, 3, None
# 提示:
#   - 预测框线宽, None=自动按图大小
line_width: null

# 是否可视化特征图
# 示例: False, True
# 提示:
#   - 可视化模型特征图
#   - 调试用
visualize: false

# 是否使用测试时增强(TTA)
# 示例: False, True
# 提示:
#   - True: TTA, 精度更高但更慢
#   - 通常推理保持 False
augment: false

# 是否跨类别 NMS
# 示例: False, True
# 提示:
#   - True: NMS 不分类别(可抑制类别间重叠)
agnostic_nms: false

# 高分辨率 mask(仅分割)
# 示例: False, True
# 提示:
#   - 仅 segment 任务
#   - True: 高质量 mask 但更慢
retina_masks: false


#------------------------------------------------------------------------------
# 设备配置
#------------------------------------------------------------------------------

# 设备选择(0/cpu/mps/[0,1]/0,1)
# 示例: 0, 0, cpu, mps, [0, 1]
# 提示:
#   - None: 自动选择(优先 GPU)
#   - int: GPU 编号(0, 1, 2...)
#   - 'cpu': 使用 CPU
#   - 'mps': Mac M1/M2 GPU
#   - [0,1] 或 '0,1': 多 GPU 训练
#   - -1: 选择最空闲的 GPU
device: null

# 是否启用 AMP(推荐开启)
# 示例: True, False
# 提示:
#   - True: 使用 FP16 混合精度(快 + 省显存)
#   - False: 使用 FP32 全精度
#   - 现代 GPU (20 系+) 强烈推荐开启
#   - CPU 训练时自动禁用
amp: true


#------------------------------------------------------------------------------
# 输出配置
#------------------------------------------------------------------------------

# 项目输出目录(None=框架自动)
# 示例: runs/detect, experiments/safety
# 提示:
#   - 训练输出的根目录
#   - 默认: 由 service 层根据 task 自动拼装(runs/<task>/)
project: null

# 实验名称
# 示例: exp, safety_v1, baseline
# 提示:
#   - 每次运行的子目录名
#   - 默认: ultralytics 自动生成 exp, exp2, exp3...
name: null

# 是否覆盖已有实验目录
# 示例: False, True
# 提示:
#   - False: 自动创建新目录(exp2, exp3...)
#   - True: 覆盖已有目录
#   - 生产环境建议 False
exist_ok: false


#------------------------------------------------------------------------------
# 输出控制
#------------------------------------------------------------------------------

# 是否保存结果
# 示例: True, False
# 提示:
#   - 保存带标注的结果图/视频
save: true

# 是否保存 TXT 标签
# 示例: False, True
# 提示:
#   - 将预测保存为 YOLO 格式 txt
save_txt: false

# 标签是否显示置信度
# 示例: True, False
# 提示:
#   - 输出图上显示置信度数值
save_conf: true

# 是否保存预测裁剪图
# 示例: False, True
# 提示:
#   - 保存每个预测框的裁剪图
save_crop: false

# 是否实时显示结果
# 示例: False, True
# 提示:
#   - True: 弹窗实时显示
show: false

# 是否显示类别标签
# 示例: True, False
# 提示:
#   - 输出图上显示类别名
show_labels: true

# 是否显示置信度
# 示例: True, False
# 提示:
#   - 输出图上显示置信度
show_conf: true

# 是否显示检测框
# 示例: True, False
# 提示:
#   - 输出图上画检测框
show_boxes: true


#------------------------------------------------------------------------------
# 基础设置
#------------------------------------------------------------------------------

# 是否显示详细日志
# 示例: True, False
# 提示:
#   - True: 显示详细日志
#   - False: 只显示关键信息
verbose: true

# 随机种子(可复现性)
# 示例: 0, 42, 2026
# 提示:
#   - 控制随机性, 确保可复现
#   - 相同种子 = 相同结果
#   - 建议每个实验使用不同种子
seed: 0

# 是否强制确定性算法
# 示例: True, False
# 提示:
#   - True: 强制使用确定性算法(完全可复现)
#   - False: 允许非确定性算法(可能更快)
#   - 实验对比时必须设为 True
deterministic: true


#------------------------------------------------------------------------------
# 视频流
#------------------------------------------------------------------------------

# 视频流模式
# 示例: False, True
# 提示:
#   - True: 流式处理(不一次读完整视频)
stream: false

# 是否缓冲视频流
# 示例: False, True
# 提示:
#   - True: 缓冲帧避免丢帧
stream_buffer: false


#------------------------------------------------------------------------------
# 任务特定
#------------------------------------------------------------------------------

# 裁剪后是否 NMS
# 示例: False, True
# 提示:
#   - 裁剪推理后是否 NMS
crop_nms: false


#==============================================================================
# 常见问题
#==============================================================================
#
# Q: 如何修改配置?
# A: 直接编辑对应参数的值, 保存后重新运行即可
#
# Q: 命令行参数会覆盖配置文件吗?
# A: 是的, 命令行参数优先级最高: CLI > YAML > DEFAULT
#
# Q: 如何恢复默认配置?
# A: 删除此文件, 程序会自动报错并提示重新生成
#
# Q: 如何用新版默认值重新生成此模板?
# A: 跑 'odp-gen-config <name> --overwrite' (会自动备份原文件)
#    备胎(装包前可用): python -m od_platform.runtime_config.generator <name> --overwrite
#
#==============================================================================