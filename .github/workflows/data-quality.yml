name: D3 D4 data quality

on:
  push:
    branches: [data_new_function, main]
    paths:
      - 'apps/platform/src/od_platform/common/**'
      - 'apps/platform/src/od_platform/data_pipeline/**'
      - 'apps/platform/src/od_platform/data_validation/**'
      - 'apps/platform/src/od_platform/cli/*data.py'
      - 'apps/platform/tests/**'
      - 'scripts/demo_data/**'
      - '**/pyproject.toml'
      - 'requirements-data-dev.txt'
      - '.github/workflows/data-quality.yml'
  pull_request:
    paths:
      - 'apps/platform/**'
      - 'scripts/demo_data/**'
      - 'pyproject.toml'
      - 'requirements-data-dev.txt'
      - '.github/workflows/data-quality.yml'

permissions:
  contents: read

jobs:
  data-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-data-dev.txt
      - name: Install data development tools
        run: python -m pip install -r requirements-data-dev.txt
      - name: Run isolated data regression tests
        run: >-
          python -m pytest -c pyproject.toml
          apps/platform/tests/test_data_pipeline.py
          apps/platform/tests/test_data_validation.py
          apps/platform/tests/test_data_engineering.py
          apps/platform/tests/test_data_identity.py
          --junitxml=data-test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: data-test-results.xml
